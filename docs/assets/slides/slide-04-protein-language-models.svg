  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #132b3d" x="57.6" y="514.512" transform="rotate(-0 57.6 514.512)">Ask: what was learned, what is being predicted, and how was it validated?</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #006e7d" x="57.6" y="554.04" transform="rotate(-0 57.6 554.04)">Protein language model ≠ structure predictor</text>
  </g>
  <g id="text_21">
