  <g id="text_15">
   <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #132b3d" x="40.32" y="74.52" transform="rotate(-0 40.32 74.52)">Learning the language of proteins.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586a77" x="40.32" y="104.976" transform="rotate(-0 40.32 104.976)">A learned representation is not yet a structural answer.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #586a77" x="345.6" y="275.4" transform="rotate(-0 345.6 275.4)">Learn</text>
  </g>
  <g id="text_18">
