  </g>
  <g id="text_22">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586a77" x="40.32" y="633.744" transform="rotate(-0 40.32 633.744)">ESMC supplies learned representations; ESMFold2 combines representations with a structure-prediction architecture and supports optional MSA input.</text>
  </g>
