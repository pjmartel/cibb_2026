  <g id="text_18">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #006e7d" x="40.32" y="34.344" transform="rotate(-0 40.32 34.344)">SYNTHESIS | SLIDE 15</text>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #132b3d" x="40.32" y="74.52" transform="rotate(-0 40.32 74.52)">Build an evidence chain, not a gallery of models.</text>
  </g>
  <g id="text_20">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586a77" x="40.32" y="104.976" transform="rotate(-0 40.32 104.976)">The question determines the method; this is not a mandatory sequence of software.</text>
  </g>
  <g id="text_21">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #132b3d" x="57.6" y="338.256" transform="rotate(-0 57.6 338.256)">Three questions to carry into every analysis</text>
  </g>
  <g id="text_22">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #006e7d" x="57.6" y="397.872" transform="rotate(-0 57.6 397.872)">01</text>
  </g>
  <g id="text_23">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #132b3d" x="97.92" y="397.872" transform="rotate(-0 97.92 397.872)">What supports this model?</text>
  </g>
  <g id="text_24">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #006e7d" x="57.6" y="457.488" transform="rotate(-0 57.6 457.488)">02</text>
  </g>
  <g id="text_25">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #132b3d" x="97.92" y="457.488" transform="rotate(-0 97.92 457.488)">What conclusion does it actually support?</text>
  </g>
  <g id="text_26">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #006e7d" x="57.6" y="517.104" transform="rotate(-0 57.6 517.104)">03</text>
  </g>
  <g id="text_27">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #132b3d" x="97.92" y="517.104" transform="rotate(-0 97.92 517.104)">What experiment could change the interpretation?</text>
  </g>
  <g id="text_28">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586a77" x="40.32" y="620.136" transform="rotate(-0 40.32 620.136)">Synthesis of the methods discussed. Tool names identify questions and outputs, not guarantees or a performance ranking.</text>
  </g>
  <g id="text_29">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586a77" x="40.32" y="633.744" transform="rotate(-0 40.32 633.744)">Observations, computational predictions and biological hypotheses should remain distinguishable.</text>
  </g>
 </g>
